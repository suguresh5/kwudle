version: "3.9"

# Compose this on top of the base stack:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Prometheus scrapes all 4 Kwudle services.
# Grafana auto-provisions the Kwudle dashboard from config/grafana/dashboards/kwudle.json.

networks:
  sentinel-net:
    name: kwudle-merged_sentinel-net
    external: true

services:

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinel-prometheus
    hostname: prometheus
    restart: unless-stopped
    networks: [sentinel-net]
    ports: ["9393:9090"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:11.0.0
    container_name: sentinel-grafana
    hostname: grafana
    restart: unless-stopped
    networks: [sentinel-net]
    ports: ["3030:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: kwudle2024
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kwudle.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
