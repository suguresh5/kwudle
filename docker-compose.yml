
networks:
  sentinel-net:
    driver: bridge

volumes:
  ch01-data:
  ch02-data:
  keeper-data:
  redis-data:

services:

  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:24.3
    container_name: clickhouse-keeper
    hostname: clickhouse-keeper
    restart: unless-stopped
    networks: [sentinel-net]
    volumes:
      - keeper-data:/var/lib/clickhouse-keeper
      - ./config/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    expose: ["9181", "9444"]
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 9181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  clickhouse-01:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-01
    hostname: clickhouse-01
    restart: unless-stopped
    depends_on:
      clickhouse-keeper: { condition: service_healthy }
    networks: [sentinel-net]
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ch01-data:/var/lib/clickhouse
      - ./config/clickhouse-01/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse-01/keeper_use.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: sentinel_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user sentinel_user --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse-02:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-02
    hostname: clickhouse-02
    restart: unless-stopped
    depends_on:
      clickhouse-keeper: { condition: service_healthy }
    networks: [sentinel-net]
    expose: ["8123", "9000"]
    volumes:
      - ch02-data:/var/lib/clickhouse
      - ./config/clickhouse-02/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse-02/keeper_use.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: sentinel_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user sentinel_user --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: sentinel-redis
    hostname: redis
    restart: unless-stopped
    networks: [sentinel-net]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    env_file: [.env]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  sentinel-ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    container_name: sentinel-ingest
    hostname: sentinel-ingest
    restart: unless-stopped
    depends_on:
      clickhouse-01: { condition: service_healthy }
      redis:         { condition: service_healthy }
    networks: [sentinel-net]
    ports: ["8080:8080", "4317:4317", "4318:4318", "9090:9090"]
    env_file: [.env]
    environment:
      SERVICE_NAME: sentinel-ingest
      CLICKHOUSE_HOST: clickhouse-01
      CLICKHOUSE_PORT: "9000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes: ["./data/dlq:/data/dlq"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  sentinel-worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: sentinel-worker
    hostname: sentinel-worker
    restart: unless-stopped
    depends_on:
      clickhouse-01: { condition: service_healthy }
      redis:         { condition: service_healthy }
    networks: [sentinel-net]
    ports: ["9091:9091"]
    env_file: [.env]
    environment:
      SERVICE_NAME: sentinel-worker
      CLICKHOUSE_HOST: clickhouse-01
      CLICKHOUSE_PORT: "9000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes: ["./data/dlq:/data/dlq"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sentinel-api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: sentinel-api
    hostname: sentinel-api
    restart: unless-stopped
    depends_on:
      clickhouse-01: { condition: service_healthy }
      redis:         { condition: service_healthy }
    networks: [sentinel-net]
    ports: ["3001:3001"]
    env_file: [.env]
    environment:
      SERVICE_NAME: sentinel-api
      CLICKHOUSE_HOST: clickhouse-01
      CLICKHOUSE_PORT: "8123"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  sentinel-dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    hostname: sentinel-dashboard
    restart: unless-stopped
    depends_on:
      sentinel-api: { condition: service_healthy }
    networks: [sentinel-net]
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      CLICKHOUSE_HOST: clickhouse-01
      CLICKHOUSE_PORT: "8123"
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_API_KEY: 6e3df3d7f06c3afe830c15c9945dbfd480e65e54dd74d734e4dd12611eeaf1d7
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
