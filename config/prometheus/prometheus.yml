global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinel-ingest
    static_configs:
      - targets: ['sentinel-ingest:8080']
    metrics_path: /metrics

  - job_name: sentinel-worker
    static_configs:
      - targets: ['sentinel-worker:9091']
    metrics_path: /metrics

  - job_name: sentinel-api
    static_configs:
      - targets: ['sentinel-api:3001']
    metrics_path: /metrics

  - job_name: sentinel-dashboard
    static_configs:
      - targets: ['sentinel-dashboard:3000']
    metrics_path: /api/metrics
